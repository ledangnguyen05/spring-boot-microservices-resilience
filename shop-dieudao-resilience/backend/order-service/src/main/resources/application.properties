spring.application.name=order-service

server.port=8082

# H2 Database & JPA Configuration
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===== (code mau ban dau) Feign client "xxx": dung cho endpoint goc /api/orders/{id} =====
# connectTimeout = 2000: toi da 2 giay de thiet lap ket noi.
spring.cloud.openfeign.client.config.xxx.connectTimeout=2000
# readTimeout = 3000: toi da 3 giay cho doc phan hoi tu service ben kia.
spring.cloud.openfeign.client.config.xxx.readTimeout=3000

# ===== Feign client "user-resilient": dung cho cac demo Resilience4j =====
# Luu y: readTimeout (3000) > timeLimiter (1500) -> TimeLimiter cat truoc, Feign la "luoi an toan" thu hai.
spring.cloud.openfeign.client.config.user-resilient.connectTimeout=1000
spring.cloud.openfeign.client.config.user-resilient.readTimeout=3000

user-service.url=http://localhost:8081

# ============================================================
# THAM SO RESILIENCE4J CHO DEMO (sua roi restart de thu nghiem)
# ============================================================
# --- TIMEOUT (TimeLimiter) ---
demo.timeout.duration-ms=1500

# --- RETRY ---
demo.retry.max-attempts=3
demo.retry.initial-wait-ms=500
demo.retry.multiplier=2.0

# --- BULKHEAD (semaphore, dung cho demo 3) ---
demo.bulkhead.max-concurrent=3

# --- BULKHEAD (thread pool, dung cho demo ket hop) ---
# suc chua = core threads + queue (o day: 3 + 2 = 5 request cung luc)
demo.tpb.core-threads=3
demo.tpb.max-threads=3
demo.tpb.queue-capacity=2

# --- CIRCUIT BREAKER ---
demo.cb.window-size=5
demo.cb.failure-rate-threshold=50
demo.cb.open-wait-seconds=10
demo.cb.half-open-calls=2

# Xem log cua cac pattern
logging.level.com.npt.orderservice=INFO

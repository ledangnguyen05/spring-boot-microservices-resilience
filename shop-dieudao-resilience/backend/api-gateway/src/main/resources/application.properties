server.port=8080
spring.application.name=api-gateway

# Route 0: user-service API
spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**,/api/chaos,/api/chaos/**

# Route 1: order-service API
spring.cloud.gateway.server.webflux.routes[1].id=order-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

# Route 2: OpenAPI docs của order-service
spring.cloud.gateway.server.webflux.routes[2].id=order-service-docs
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/v3/api-docs/order-service
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/v3/api-docs/order-service, /v3/api-docs

# Route 3: OpenAPI docs của user-service
spring.cloud.gateway.server.webflux.routes[3].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/v3/api-docs/user-service
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/v3/api-docs/user-service, /v3/api-docs

# Cấu hình Swagger UI Aggregator trên Gateway (port 8080)
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Order Service (Resilience API)
springdoc.swagger-ui.urls[0].url=/v3/api-docs/order-service
springdoc.swagger-ui.urls[1].name=User Service (Chaos Simulator)
springdoc.swagger-ui.urls[1].url=/v3/api-docs/user-service

logging.level.org.springframework.cloud.gateway=DEBUG

management.endpoints.web.exposure.include=gateway,health,info,metrics
management.endpoint.gateway.access=read-only

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=20s

# Keep the gateway's CORS headers when a downstream service also sends them.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
